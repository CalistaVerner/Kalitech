plugins {
    id 'java'
    id 'application'
    id 'java-library'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}

application {
    mainClass = 'org.foxesworld.kalitech.engine.KalitechLauncher'
}

repositories {
    mavenCentral()
}

dependencies {
    implementation project(':kalitech-core')
    implementation project(':kalitech-neural')
    implementation("com.github.ben-manes.caffeine:caffeine:3.2.3")

    implementation platform("com.fasterxml.jackson:jackson-bom:2.19.0")
    implementation "com.fasterxml.jackson.datatype:jackson-datatype-jsr310"

    api "org.jmonkeyengine:jme3-core:${rootProject.ext.jmeVersion}"
    api "org.jmonkeyengine:jme3-desktop:${rootProject.ext.jmeVersion}"
    api "org.jmonkeyengine:jme3-lwjgl3:${rootProject.ext.jmeVersion}"
    api "org.jmonkeyengine:jme3-plugins:${rootProject.ext.jmeVersion}"
    api "org.jmonkeyengine:jme3-effects:${rootProject.ext.jmeVersion}"
    api "org.jmonkeyengine:jme3-jogg:${rootProject.ext.jmeVersion}"

    api "org.jmonkeyengine:jme3-awt-dialogs:${rootProject.ext.jmeVersion}"
    api 'com.github.stephengold:Minie:9.0.3'

    api "org.luaj:luaj-jse:${rootProject.ext.luaJVersion}"

    implementation "com.simsilica:lemur:1.16.0"
    implementation "org.apache.groovy:groovy-jsr223:5.0.3"

    testImplementation platform("org.junit:junit-bom:${rootProject.ext.junitBom}")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

java {
    toolchain { languageVersion = JavaLanguageVersion.of(17) }
}

tasks.shadowJar {
    archiveClassifier.set("all")

    manifest {
        attributes("Main-Class": application.mainClass.get())
    }

    mergeServiceFiles()
    exclude("META-INF/*.SF", "META-INF/*.DSA", "META-INF/*.RSA")
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.assemble {
    dependsOn tasks.shadowJar
}

tasks.named('run', JavaExec) {
    dependsOn rootProject.tasks.named('syncModuleJars')
    workingDir rootProject.projectDir
}

tasks.test {
    dependsOn rootProject.tasks.named("syncModuleJars")
    systemProperty "kalitech.repoRoot", rootProject.projectDir.absolutePath
    systemProperty "log.dir", layout.buildDirectory.dir("test-logs").get().asFile.absolutePath
}
